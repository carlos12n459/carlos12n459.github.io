<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrecioFlash - Administración</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1d2630; }
  header { background: #0b1b2b; color: #fff; padding: 14px 24px; }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 20px; padding: 20px 24px; }
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #e3e8ee; text-align: left; vertical-align: top; }
  tr:hover { background: #f0f7f3; cursor: pointer; }
  form { background: #fff; padding: 16px; border-radius: 8px; display: grid; gap: 10px; align-content: start; }
  label { font-size: 12px; font-weight: 600; display: grid; gap: 4px; }
  input, select, textarea { font: inherit; padding: 7px; border: 1px solid #c9d2dc; border-radius: 6px; }
  textarea { min-height: 60px; }
  .row { display: flex; gap: 8px; align-items: center; }
  button { font: inherit; padding: 8px 12px; border: 0; border-radius: 6px; background: #00a65a; color: #fff; cursor: pointer; }
  button.secondary { background: #6b7785; }
  button.danger { background: #c0392b; }
  .msg { font-size: 13px; min-height: 18px; }
  .msg.error { color: #c0392b; }
  .msg.ok { color: #1e8449; }
  .hint { font-size: 12px; color: #5b6772; }
  .readonly { background: #eef1f4; }
</style>
</head>
<body>
<header><strong>PrecioFlash</strong> &middot; Administración de productos (solo local)</header>
<main>
  <section>
    <table>
      <thead><tr><th>Nombre</th><th>Categoría</th><th>ASIN</th><th>Estado</th><th>Precio (bot)</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <form id="form">
    <input type="hidden" name="id">
    <h3 id="title" style="margin:0">Nuevo producto</h3>
    <label>Nombre <input name="name" required maxlength="200"></label>
    <label>Marca <input name="brand" maxlength="100"></label>
    <label>Categoría
      <select name="category" required></select>
    </label>
    <label>Modelo <input name="model" maxlength="100"></label>
    <label>ASIN de Amazon <input name="asin" maxlength="10" placeholder="B0XXXXXXXX"></label>
    <span class="hint">Con ASIN, el enlace de afiliado se arma automáticamente con tu tag. El precio lo pondrá el bot cuando esté activo; por ahora se muestra "Consultar precio en Amazon".</span>
    <label>URL de imagen (https) <input name="image" maxlength="500"></label>
    <label>Descripción <textarea name="description" maxlength="500"></textarea></label>
    <label>Especificaciones (una por línea, formato clave: valor) <textarea name="specs"></textarea></label>
    <label>Enlace de Amazon (opcional, se convierte en tu enlace de afiliado) <input name="productUrl" maxlength="500"></label>
    <div class="row">
      <label><input type="checkbox" name="featured"> Destacado</label>
      <label><input type="checkbox" name="popular"> Popular</label>
    </div>
    <label>Estado
      <select name="status">
        <option value="published">Publicado</option>
        <option value="draft">Borrador</option>
      </select>
    </label>
    <label>Precio, enlace de afiliado y fecha (solo los gestiona el bot)
      <input class="readonly" id="botinfo" readonly>
    </label>
    <div class="row">
      <button type="submit">Guardar</button>
      <button type="button" class="secondary" id="reset">Nuevo</button>
      <button type="button" class="danger" id="remove">Eliminar</button>
    </div>
    <div class="msg" id="msg"></div>
  </form>
</main>
<script>
const CATEGORIES = [
  ['gpu','Tarjetas gráficas'],['cpu','Procesadores'],['desktop','PC gaming'],['laptop','Portátiles gaming'],
  ['monitor','Monitores'],['ram','Memorias RAM'],['storage','SSD y HDD'],['motherboard','Placas base'],
  ['psu','Fuentes de alimentación'],['cooling','Refrigeración'],['case','Gabinetes'],
  ['peripherals','Periféricos gaming'],['audio','Auriculares y audio']
];
const form = document.getElementById('form');
const msg = document.getElementById('msg');
let products = [];
let selectedId = null;

form.category.innerHTML = CATEGORIES.map(([id, name]) => '<option value="' + id + '">' + name + '</option>').join('');

const show = (text, ok) => { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'error'); };
const specsToText = specs => Object.entries(specs || {}).map(([k, v]) => k + ': ' + v).join('\n');

function fill(p) {
  selectedId = p ? p.id : null;
  document.getElementById('title').textContent = p ? 'Editar: ' + p.name : 'Nuevo producto';
  form.id.value = p ? p.id : '';
  for (const key of ['name','brand','model','asin','image','description','productUrl','category','status']) {
    form[key].value = p ? (p[key] || '') : (key === 'category' ? 'gpu' : key === 'status' ? 'published' : '');
  }
  form.specs.value = p ? specsToText(p.specs) : '';
  form.featured.checked = !!(p && p.featured);
  form.popular.checked = !!(p && p.popular);
  document.getElementById('botinfo').value = p && p.priceCheckedAt
    ? (p.price ? p.price + ' ' + (p.currency || 'EUR') + ' - consultado ' + p.priceCheckedAt : 'Sin oferta válida')
    : 'Sin consultar';
  document.getElementById('remove').style.display = p ? '' : 'none';
  show('', true);
}

function render() {
  document.getElementById('rows').innerHTML = products.map(p =>
    '<tr data-id="' + p.id + '"><td>' + escapeHtml(p.name) + '</td><td>' + p.category + '</td><td>' +
    (p.asin || '-') + '</td><td>' + p.status + '</td><td>' + (p.price ? p.price + ' ' + (p.currency || 'EUR') : '-') + '</td></tr>'
  ).join('');
}

const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  const res = await fetch('/api/products');
  products = await res.json();
  render();
}

document.getElementById('rows').addEventListener('click', e => {
  const tr = e.target.closest('tr');
  if (!tr) return;
  fill(products.find(p => p.id === tr.dataset.id));
});

document.getElementById('reset').addEventListener('click', () => fill(null));

form.addEventListener('submit', async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  data.featured = form.featured.checked;
  data.popular = form.popular.checked;
  const url = selectedId ? '/api/products/' + selectedId : '/api/products';
  const res = await fetch(url, { method: selectedId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const body = await res.json();
  if (!res.ok) return show(body.error, false);
  show('Guardado. Recuerda publicar con git push.', true);
  await load();
  fill(products.find(p => p.id === body.id) || products.find(p => p.id === selectedId));
});

document.getElementById('remove').addEventListener('click', async () => {
  if (!selectedId || !confirm('¿Eliminar este producto?')) return;
  const res = await fetch('/api/products/' + selectedId, { method: 'DELETE' });
  if (!res.ok) return show((await res.json()).error, false);
  await load();
  fill(null);
  show('Eliminado. Recuerda publicar con git push.', true);
});

// Al pegar un enlace de Amazon: rellena el ASIN y, si el nombre está vacío, el título que trae el propio enlace.
form.productUrl.addEventListener('input', () => {
  const raw = form.productUrl.value.trim();
  const asinMatch = raw.match(/\/(?:dp|gp\/product)\/([A-Z0-9]{10})(?=[\/?#&]|$)/i);
  if (asinMatch) form.asin.value = asinMatch[1].toUpperCase();
  const slugMatch = raw.match(/amazon\.[a-z.]+\/([^\/?#]+)\/(?:dp|gp\/product)\//i);
  if (slugMatch && !form.name.value.trim()) {
    const title = decodeURIComponent(slugMatch[1]).replace(/[-_+]+/g, ' ').trim();
    if (title && title.toLowerCase() !== 'dp') form.name.value = title;
  }
});

fill(null);
load();
</script>
</body>
</html>
