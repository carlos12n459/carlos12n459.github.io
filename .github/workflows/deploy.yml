name: Actualizar precios y publicar

on:
  push:
    branches: [main]
  schedule:
    # Cada 12 horas: el precio nunca supera las 24 h de antigÃ¼edad.
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Consultar precios en Amazon
        run: node scripts/update-prices.mjs
        env:
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          CREATORS_VERSION: ${{ vars.CREATORS_VERSION }}
          CREATORS_PARTNER_TAG: ${{ vars.CREATORS_PARTNER_TAG }}
          CREATORS_MARKETPLACE: ${{ vars.CREATORS_MARKETPLACE }}

      - name: Compilar sitio estÃ¡tico
        run: npm run build --prefix apps/web
        env:
          VITE_SITE_ORIGIN: https://carlos12n459.github.io

      - name: Preparar 404 para GitHub Pages
        run: cp dist/apps/web/client/__spa-fallback.html dist/apps/web/client/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/web/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
